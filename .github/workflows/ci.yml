name: Windows plugin checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-phone:
    name: No-phone checks (Node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Restore locked dependencies without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck, fixtures, bundle, and copied-artifact protocol checks
        run: npm run check
  gesture-helper:
    name: Android helper sources and embedded DEX
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
      - name: Test Java injection and timing logic
        run: npm run test:gestures
      - name: Test Java Unicode text-setting and field guards
        run: npm run test:text
      - name: Check embedded DEX matches the source
        run: |
          npm run build:gestures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:text
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- src\gesture-helper-data.ts src\text-helper-data.ts
