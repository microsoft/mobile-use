name: Windows plugin checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-phone:
    name: No-phone checks (Node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Restore locked dependencies without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck, fixtures, bundle, and copied-artifact protocol checks
        run: npm run check
  gesture-helper:
    name: Gesture helper source and embedded DEX
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install pinned helper build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test Java injection and timing logic
        run: npm run test:gestures
      - name: Check embedded DEX matches the source
        run: |
          npm run build:gestures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- src/gesture-helper-data.ts
