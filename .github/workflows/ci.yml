name: Windows plugin checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-phone:
    name: No-phone checks (Node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Restore locked dependencies without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck, fixtures, bundle, and copied-artifact protocol checks
        run: npm run check
