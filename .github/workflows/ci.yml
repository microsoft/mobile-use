name: MSMT simulation checks

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-phone:
    name: Simulation (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Restore locked dependencies without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and policy simulation tests
        run: npm run check
      - name: Run the synthetic Android/iOS demo
        run: npm run demo:msmt
